name: Run ESLint

on:
  push:
    paths:
      - "packages/**"
  pull_request:
    paths:
      - "packages/**"

jobs:
  run-eslint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run ESLint
        run: npm run lint
