name: Run ESLint

on: [push, pull_request]

jobs:
  check-changes:
    name: Check Changes
    outputs:
      packages: ${{ steps.changes.outputs.packages }}
    permissions:
      contents: read                                                                         
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            packages:
              - 'packages/**'
  run-eslint:
    if: needs.check-changes.outputs.packages == 'true'
    name: Run ESLint
    needs: check-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run ESLint
        run: npm run lint
