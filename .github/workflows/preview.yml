name: Preview

on:
  push:
    branches-ignore: [ deploy ]

jobs:
  check-token:
    runs-on: ubuntu-latest
    outputs:
      token-exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if Vercel Token exists
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        if: "${{ env.VERCEL_TOKEN != '' }}"
        run: echo "::set-output name=exists::true"

  preview:
    if: needs.check-token.outputs.token-exists == 'true'
    needs: [check-token]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions: 
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Install Vercel CLI
        run: npm i vercel

      - name: Pull Vercel Environment
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel Project
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Start GitHub Deployment
        id: deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: preview

      - name: Deploy
        id: vercel_deployment
        run: |
          URL=$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tail -n1)
          echo "ENV_URL=$URL" >> $GITHUB_OUTPUT

      - name: Update GitHub Deployment Status
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: ${{ steps.vercel_deployment.outputs.ENV_URL }}
          env: preview
